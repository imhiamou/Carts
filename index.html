<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Medieval Pixel Cart</title>
<style>
body { margin:0; background:#2c5e2c; overflow:hidden; touch-action: manipulation; }
canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; touch-action: manipulation; }
#ui {
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  color:white;
  font-size:28px;
  display:none;
  z-index:20;
}
button { font-size:20px; padding:14px 24px; min-height:48px; touch-action: manipulation; }
.overlay {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0, 0, 0, 0.65);
  z-index:30;
}
.panel {
  width:min(92vw, 440px);
  background:rgba(25, 25, 25, 0.95);
  color:#fff;
  padding:22px;
  border-radius:12px;
  text-align:center;
}
.panel h1, .panel h2 {
  margin:0 0 12px;
}
.panel p {
  margin:6px 0 14px;
}
.panel input {
  width:100%;
  box-sizing:border-box;
  font-size:18px;
  padding:10px;
  margin:8px 0;
  border:1px solid #999;
  border-radius:8px;
}
#levelButtons {
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  margin:14px 0;
}
#levelButtons button {
  width:100%;
}
#topControls {
  position:absolute;
  top:16px;
  right:16px;
  display:none;
  gap:10px;
  z-index:25;
}
#topControls button {
  font-size:16px;
  padding:8px 14px;
  min-height:unset;
}
#loginError {
  min-height:24px;
  margin-top:6px;
  color:#ff9a9a;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="authScreen" class="overlay">
  <div class="panel">
    <h1>Login</h1>
    <input id="usernameInput" type="text" placeholder="Username" autocomplete="username">
    <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginButton">Login</button>
    <div id="loginError"></div>
    <p>Player: <b>mermy / wolf</b><br>Admin: <b>admin / admin</b></p>
  </div>
</div>

<div id="levelMenu" class="overlay" style="display:none;">
  <div class="panel">
    <h2 id="menuTitle">Select Level</h2>
    <p id="menuSubtitle"></p>
    <div id="levelButtons"></div>
    <button id="continueButton" onclick="closeLevelMenu()" style="display:none; margin-bottom:10px;">Continue</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div id="topControls">
  <button onclick="openLevelMenu()">Levels</button>
  <button onclick="logout()">Logout</button>
</div>

<div id="ui">
  <div id="result"></div>
  <button onclick="restartGame()">Restart</button>
  <button onclick="openLevelMenu()">Level Menu</button>
</div>

<script src="game.js"></script>
</body>
</html>
